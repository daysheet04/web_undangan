name = "daymoment-affiliate"
main = "worker/affiliate-index.js"
compatibility_date = "2026-09-16"
compatibility_flags = ["nodejs_compat"]
keep_vars = true
routes = [
  { pattern = "affiliate.daymoment.biz.id", custom_domain = true }
]

[vars]
SUPABASE_URL = "https://jhdzitzatdudigapxpff.supabase.co"
AFFILIATE_APP_URL = "https://affiliate.daymoment.biz.id"
PUBLIC_APP_URL = "https://daymoment.biz.id"
SMTP_HOST = "smtp.gmail.com"
SMTP_PORT = 465
AFFILIATE_SMTP_FROM_NAME = "Daymoment Verifikasi"
MIDTRANS_IS_PRODUCTION = false

[assets]
directory = "./dist-affiliate"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "daymoment-media"
preview_bucket_name = "daymoment-media-preview"

